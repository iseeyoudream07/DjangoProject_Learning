{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4" style="min-height: 60vh; align-items: center;">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4 p-md-5">
                <h2 class="mb-4 fw-bold text-dark border-bottom pb-3">编辑个人资料</h2>

                <form action="{% url 'users:edit_profile' %}" method="post" novalidate>
                    {% csrf_token %}

                    {% for field in form %}
                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold text-secondary mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}
                                <div class="form-text text-muted small mt-2 lh-sm">{{ field.help_text|safe }}</div>
                            {% endif %}
                            {% for error in field.errors %}
                                <div class="text-danger small mt-1 fw-bold">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{% url 'users:profile' %}" class="btn btn-outline-secondary me-md-2">取消</a>
                        <button class="btn btn-custom px-4 shadow-sm" type="submit">保存资料</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
